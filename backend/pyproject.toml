[project]
name = "smartnotebook"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Django==5.2.2",
  "djangorestframework==3.16.1",
  "psycopg2-binary==2.9.12",
  "gunicorn==25.3.0",
  "scikit-learn==1.8.0",
  "numpy==2.4.4",
  "django-cors-headers==4.9.0",
  "djangorestframework-simplejwt[crypto]==5.5.1",
  "pypdf==6.10.0",
  "python-json-logger==2.0.7",
  "pillow==11.3.0",
]

[tool.uv]
dev-dependencies = ["coverage==7.6.1", "ruff==0.9.1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "F401"]
"*/tests.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
